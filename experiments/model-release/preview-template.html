<div id="model-release-experiment-preview" class="viz-dotted-background">
  <style>
    #model-release-experiment-preview { padding: 12px; }
    #model-release-experiment-preview .experiment-surface { background: #0a192f; color: #e6f1ff; padding: 28px; border-radius: 8px; font: 16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    #model-release-experiment-preview h1 { margin: 0 0 30px; font-size: 28px; line-height: 1.25; font-weight: 500; }
    #model-release-experiment-preview h2 { margin: 0 0 16px; font-size: 22px; font-weight: 500; }
    #model-release-experiment-preview h3 { margin: 0 0 6px; font-size: 19px; font-weight: 500; overflow-wrap: anywhere; }
    #model-release-experiment-preview .provider-stack { display: grid; grid-template-columns: minmax(0,1fr); gap: 36px; }
    #model-release-experiment-preview .release-list { display: grid; grid-template-columns: minmax(0,1fr); gap: 18px; }
    #model-release-experiment-preview .model-card { background: #172a45; color: #e6f1ff; border: 1px solid #8892b0; border-radius: 8px; padding: 22px; }
    #model-release-experiment-preview .claude-lane .model-card { background: #211d1b; color: #faf9f5; border-color: #d97757; }
    #model-release-experiment-preview .model-date { margin: 0 0 16px; font-size: 13px; color: #ccd6f6; }
    #model-release-experiment-preview .claude-lane .model-date { color: #e2cfbf; }
    #model-release-experiment-preview .run-links { list-style: none; margin: 0; padding: 0; }
    #model-release-experiment-preview .run-links li + li { border-top: 1px solid #4f617d; }
    #model-release-experiment-preview a { color: #64ffda; text-decoration: none; }
    #model-release-experiment-preview .run-links a { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; flex-wrap: wrap; overflow-wrap: anywhere; }
    #model-release-experiment-preview .claude-lane a { color: #edb59e; }
    #model-release-experiment-preview .run-status { font-size: 13px; color: #e6f1ff; }
    #model-release-experiment-preview a:hover { text-decoration: underline; }
    #model-release-experiment-preview a:focus-visible { outline: 2px solid #64ffda; outline-offset: 4px; }
    @media (max-width:480px) { #model-release-experiment-preview { padding: 6px; } #model-release-experiment-preview .experiment-surface { padding: 20px 16px; } #model-release-experiment-preview .model-card { padding: 18px; } #model-release-experiment-preview h1 { font-size: 24px; } }
  </style>
  <section class="experiment-surface" aria-label="Model Release Experiment">
    <h1>The Model Release Experiment</h1>
    <div class="provider-stack"><!-- MODEL_LANES --></div>
  </section>
</div>
