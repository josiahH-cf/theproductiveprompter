name: Refresh GitHub projects and activity

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      profile_snapshot_verified:
        description: "I checked the owner's signed-in profile total, including private activity"
        type: boolean
        default: false
      profile_snapshot_total:
        description: "Verified combined contribution total (integer, no other data)"
        type: string
      profile_snapshot_from:
        description: "Exact profile data-from bound, including offset"
        type: string
      profile_snapshot_to:
        description: "Exact profile data-to bound, including offset"
        type: string
      profile_snapshot_checked_at:
        description: "UTC time the signed-in profile was checked (ISO 8601)"
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-pinned-projects
  cancel-in-progress: false

jobs:
  refresh-pinned-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh pinned projects and the signed-out GitHub profile calendar
        run: python3 .github/scripts/refresh_pinned_projects.py --json

      - name: Render a manually verified profile aggregate when supplied
        env:
          PROFILE_SNAPSHOT_VERIFIED: ${{ inputs.profile_snapshot_verified }}
          PROFILE_SNAPSHOT_TOTAL: ${{ inputs.profile_snapshot_total }}
          PROFILE_SNAPSHOT_FROM: ${{ inputs.profile_snapshot_from }}
          PROFILE_SNAPSHOT_TO: ${{ inputs.profile_snapshot_to }}
          PROFILE_SNAPSHOT_CHECKED_AT: ${{ inputs.profile_snapshot_checked_at }}
        run: python3 .github/scripts/refresh_github_profile_snapshot.py --dispatch-env

      - name: Commit a safe refresh when GitHub data changed
        # All existing publication guards below remain shared by both regions.
        # Scheduled runs never acquire private data or change profile snapshots.
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- projects.html; then
            echo "GitHub projects and activity are already current."
            exit 0
          fi

          release_names="$(
            gh release list --limit 100 --json tagName,isDraft \
              --jq '.[] | select(.isDraft and (.tagName | startswith("scheduled-article-"))) | .tagName'
          )"
          releases=()
          if [[ -n "$release_names" ]]; then
            mapfile -t releases <<< "$release_names"
          fi
          for release in "${releases[@]}"; do
            asset_names="$(gh release view "$release" --json assets --jq '.assets[].name')"
            assets=()
            if [[ -n "$asset_names" ]]; then
              mapfile -t assets <<< "$asset_names"
            fi
            terminal=false
            for asset in "${assets[@]}"; do
              if [[ "$asset" == "completed.json" || "$asset" == blocked-*.json ]]; then
                terminal=true
                break
              fi
            done
            if [[ "$terminal" == "false" ]]; then
              echo "Refusing to commit while scheduled Article Flow release $release is active." >&2
              exit 1
            fi
          done

          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Refusing to commit because origin/main moved during the refresh." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- projects.html
          git commit -m "Refresh GitHub projects and activity"
          commit_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main

          gh api --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null

          deadline=$((SECONDS + 1500))
          latest_status=""
          latest_commit=""
          latest_error=""
          while (( SECONDS < deadline )); do
            if latest_build="$(
              gh api -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
                --jq '[.status, .commit, (.error.message // "")] | @tsv' 2>/dev/null
            )"; then
              IFS=$'\t' read -r latest_status latest_commit latest_error <<< "$latest_build"
              if [[ "$latest_commit" == "$commit_sha" && "$latest_status" == "built" ]]; then
                echo "GitHub Pages built GitHub data commit $commit_sha."
                exit 0
              fi
              if [[ "$latest_commit" == "$commit_sha" && "$latest_status" == "errored" ]]; then
                echo "Legacy Pages build reports an error; checking the exact-commit replacement workflow."
              fi
            fi

            # A cancelled legacy build can stay errored while its replacement
            # deploys successfully. Confirm only the same main-branch commit;
            # this read-only fallback keeps the existing deadline and token.
            if python3 .github/scripts/check_github_pages_deployment.py --commit "$commit_sha"; then
              exit 0
            else
              deployment_status=$?
              if [[ "$deployment_status" -eq 2 ]]; then
                echo "GitHub Pages deployment failed GitHub data commit $commit_sha." >&2
                exit 1
              fi
            fi
            sleep 15
          done

          echo "GitHub Pages did not build GitHub data commit $commit_sha within 25 minutes (latest commit=$latest_commit status=$latest_status)." >&2
          exit 1
