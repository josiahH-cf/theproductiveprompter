<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Scarcity changes capacity and incentives</title><desc id="desc">Compute restrictions can reduce experiments and increase rewards for efficiency. Their combined effect on breakthroughs remains uncertain.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#71819d"/></marker></defs><style>
      .bg{fill:#0b1020}.panel{fill:#121a2d;stroke:#33415f;stroke-width:2}.muted{fill:#95a3bd}
      .title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.label{fill:#e8edf7;font:500 19px system-ui,sans-serif}
      .small{fill:#aebbd0;font:500 16px system-ui,sans-serif}.accent{fill:#7dd3fc}.warm{fill:#fbbf24}
      .line-a{fill:none;stroke:#7dd3fc;stroke-width:7;stroke-linecap:round}.line-b{fill:none;stroke:#fbbf24;stroke-width:7;stroke-linecap:round}
      .arrow{fill:none;stroke:#71819d;stroke-width:3;marker-end:url(#arrow)}
    </style><rect class="bg" width="1000" height="560" rx="28"/><text x="60" y="66" class="title">Scarcity changes capacity and incentives</text><rect x="55" y="218" width="240" height="140" rx="16" class="panel"/><text x="73" y="258" class="label"><tspan x="73" dy="0">Compute restrictions</tspan></text><rect x="380" y="125" width="245" height="140" rx="16" class="panel"/><text x="398" y="165" class="label"><tspan x="398" dy="0">Fewer experiments;</tspan><tspan x="398" dy="25">slower iteration</tspan></text><rect x="380" y="335" width="245" height="140" rx="16" class="panel"/><text x="398" y="375" class="label"><tspan x="398" dy="0">Stronger incentives</tspan><tspan x="398" dy="25">for efficiency</tspan></text><rect x="710" y="218" width="240" height="140" rx="16" class="panel"/><text x="728" y="258" class="label"><tspan x="728" dy="0">Net effect on</tspan><tspan x="728" dy="25">breakthroughs is</tspan><tspan x="728" dy="25">uncertain</tspan></text><path d="M295 268 C335 268,340 195,375 195" class="arrow"/><path d="M295 308 C335 308,340 405,375 405" class="arrow"/><path d="M625 195 C670 195,665 268,705 268" class="arrow"/><path d="M625 405 C670 405,665 308,705 308" class="arrow"/></svg>
