<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1180" role="img" aria-labelledby="title desc"><title id="title">Parallel review with deferral</title><desc id="desc">A shared revision goes to two parallel reviewers: one checks system correctness and one checks explanation and risks. Their findings are reconciled before a supported implementation batch, followed by an actual-diff audit; unsupported candidates are deferred and validated work is retained.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#71819d"/></marker></defs><style>
      .bg{fill:#0b1020}.panel{fill:#121a2d;stroke:#33415f;stroke-width:2}.muted{fill:#95a3bd}
      .title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.label{fill:#e8edf7;font:500 19px system-ui,sans-serif}
      .small{fill:#aebbd0;font:500 16px system-ui,sans-serif}.accent{fill:#7dd3fc}.warm{fill:#fbbf24}
      .line-a{fill:none;stroke:#7dd3fc;stroke-width:7;stroke-linecap:round}.line-b{fill:none;stroke:#fbbf24;stroke-width:7;stroke-linecap:round}
      .arrow{fill:none;stroke:#71819d;stroke-width:3;marker-end:url(#arrow)}
    .label{font-size:25px}.title{font-size:27px}.defer{stroke:#fbbf24}.return{stroke-dasharray:8 6}</style><rect class="bg" width="760" height="1180" rx="28"/><text x="40" y="60" class="title">Parallel review with deferral</text><path d="M300 210 V235 H205 V265" class="arrow"/><path d="M460 210 V235 H555 V265" class="arrow"/><path d="M205 395 V430 H300 V460" class="arrow"/><path d="M555 395 V430 H460 V460" class="arrow"/><path d="M300 565 V600 H255 V635" class="arrow"/><path d="M530 565 V605 H610 V630" class="arrow"/><path d="M255 750 V805" class="arrow"/><path d="M255 920 V995" class="arrow"/><path d="M45 860 H25 V695 H40" class="arrow return"/><path d="M465 1050 H740 V85 H380 V105" class="arrow return"/><path d="M715 710 H740" class="arrow return"/><rect x="140" y="110" width="480" height="100" rx="16" class="panel"/><text x="158" y="146" class="label"><tspan x="158" dy="0">Shared revision</tspan></text><rect x="45" y="270" width="320" height="125" rx="16" class="panel"/><text x="63" y="306" class="label"><tspan x="63" dy="0">Reviewer A: system</tspan><tspan x="63" dy="30">correctness</tspan></text><rect x="395" y="270" width="320" height="125" rx="16" class="panel"/><text x="413" y="306" class="label"><tspan x="413" dy="0">Reviewer B:</tspan><tspan x="413" dy="30">explanation and</tspan><tspan x="413" dy="30">risks</tspan></text><rect x="140" y="465" width="480" height="100" rx="16" class="panel"/><text x="158" y="501" class="label"><tspan x="158" dy="0">Reconciliation</tspan></text><rect x="45" y="640" width="420" height="110" rx="16" class="panel"/><text x="63" y="676" class="label"><tspan x="63" dy="0">Supported implementation</tspan><tspan x="63" dy="30">batch</tspan></text><rect x="45" y="810" width="420" height="110" rx="16" class="panel"/><text x="63" y="846" class="label"><tspan x="63" dy="0">Actual-diff audit</tspan></text><rect x="505" y="635" width="210" height="150" rx="16" class="panel defer"/><text x="523" y="671" class="label"><tspan x="523" dy="0">Deferred</tspan><tspan x="523" dy="30">candidates</tspan></text><rect x="45" y="1000" width="420" height="100" rx="16" class="panel"/><text x="63" y="1036" class="label"><tspan x="63" dy="0">Retained validated result</tspan></text></svg>
