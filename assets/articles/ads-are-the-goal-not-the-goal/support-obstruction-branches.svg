<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">How One Ad Model Produces Two Effects</title><desc id="desc">A shared premise that ads monetize attention branches into two independently supported effects: ads can benefit search users at a studied margin, while some placements can obstruct the immediate task. The branches rejoin in an explicitly labeled inference to judge the placement rather than advertising in general.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#71819d"/></marker></defs><style>
      .bg{fill:#0b1020}.panel{fill:#121a2d;stroke:#33415f;stroke-width:2}.muted{fill:#95a3bd}
      .title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.label{fill:#e8edf7;font:500 19px system-ui,sans-serif}
      .small{fill:#aebbd0;font:500 16px system-ui,sans-serif}.accent{fill:#7dd3fc}.warm{fill:#fbbf24}
      .line-a{fill:none;stroke:#7dd3fc;stroke-width:7;stroke-linecap:round}.line-b{fill:none;stroke:#fbbf24;stroke-width:7;stroke-linecap:round}
      .arrow{fill:none;stroke:#71819d;stroke-width:3;marker-end:url(#arrow)}
    </style><rect class="bg" width="1000" height="560" rx="28"/><text x="40" y="60" class="title">How One Ad Model Produces Two Effects</text><rect x="55" y="218" width="240" height="140" rx="16" class="panel"/><text x="73" y="258" class="label"><tspan x="73" dy="0">Ads monetize</tspan><tspan x="73" dy="25">attention</tspan></text><rect x="380" y="125" width="245" height="140" rx="16" class="panel"/><text x="398" y="165" class="label"><tspan x="398" dy="0">Benefit at a tested</tspan><tspan x="398" dy="25">search margin</tspan></text><rect x="380" y="335" width="245" height="140" rx="16" class="panel"/><text x="398" y="375" class="label"><tspan x="398" dy="0">Placement can</tspan><tspan x="398" dy="25">obstruct the</tspan><tspan x="398" dy="25">immediate task</tspan></text><rect x="710" y="218" width="240" height="140" rx="16" class="panel"/><text x="728" y="258" class="label"><tspan x="728" dy="0">Inference: judge the</tspan><tspan x="728" dy="25">placement, not all</tspan><tspan x="728" dy="25">advertising</tspan></text><path d="M295 268 C335 268,340 195,375 195" class="arrow"/><path d="M295 308 C335 308,340 405,375 405" class="arrow"/><path d="M625 195 C670 195,665 268,705 268" class="arrow"/><path d="M625 405 C670 405,665 308,705 308" class="arrow"/></svg>
