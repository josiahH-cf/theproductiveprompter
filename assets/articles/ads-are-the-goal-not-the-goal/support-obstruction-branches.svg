<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1172" role="img" aria-labelledby="title desc"><title id="title">What Happens When E Takes Over</title><desc id="desc">A conceptual comparison of two keyboard designs. Designing for a sentence keeps all letters accessible; prioritizing E replaces other keys and makes the sentence harder to type.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7dd3fc"/></marker></defs><style>.title{fill:#f8fafc;font:700 27px system-ui,sans-serif}.label{fill:#e8edf7;font:500 26px system-ui,sans-serif}.panel{fill:#121a2d;stroke:#33415f;stroke-width:2}.arrow{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}.return{stroke-dasharray:7 5}.edge-label{fill:#e8edf7;font:500 18px system-ui,sans-serif}</style><rect width="760" height="1172" rx="24" fill="#0b1020"/><text x="32" y="44" class="title"><tspan x="32" dy="0">What Happens When E Takes Over</tspan></text><path d="M295 252 V302" class="arrow" data-from="0" data-to="1"/><text x="310" y="286" class="edge-label">Start with the task</text><path d="M295 419 V469" class="arrow" data-from="1" data-to="2"/><path d="M550 196 H610 V697 H555" class="arrow" data-from="0" data-to="3"/><text transform="translate(626 446) rotate(-90)" text-anchor="middle" class="edge-label">Favor one part</text><path d="M295 753 V803" class="arrow" data-from="3" data-to="4"/><path d="M295 920 V970" class="arrow" data-from="4" data-to="5"/><rect x="40" y="140" width="510" height="112" rx="16" class="panel"/><text x="64" y="176" class="label"><tspan x="64" dy="0">Design a keyboard</tspan></text><rect x="40" y="307" width="510" height="112" rx="16" class="panel"/><text x="64" y="343" class="label"><tspan x="64" dy="0">Help a person type a sentence</tspan></text><rect x="40" y="474" width="510" height="112" rx="16" class="panel"/><text x="64" y="510" class="label"><tspan x="64" dy="0">Keep all the letters accessible</tspan></text><rect x="40" y="641" width="510" height="112" rx="16" class="panel"/><text x="64" y="677" class="label"><tspan x="64" dy="0">Treat E as the priority</tspan></text><rect x="40" y="808" width="510" height="112" rx="16" class="panel"/><text x="64" y="844" class="label"><tspan x="64" dy="0">Replace other keys with E</tspan></text><rect x="40" y="975" width="510" height="112" rx="16" class="panel"/><text x="64" y="1011" class="label"><tspan x="64" dy="0">Make the sentence harder to</tspan><tspan x="64" dy="30">type</tspan></text></svg>
