641" width="510" height="112" rx="16" class="panel"/><text x="64" y="677" class="label"><tspan x="64" dy="0">Incidents and changes</tspan></text><rect x="40" y="808" width="510" height="112" rx="16" class="panel"/><text x="64" y="844" class="label"><tspan x="64" dy="0">Ongoing assurance</tspan></text></svg>
