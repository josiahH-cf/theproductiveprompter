<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">The Capability-Linked Contract Review Loop</title><desc id="desc">Proposed loop connecting model release, contract evaluation, default review, canary against a control, telemetry by contract version, and return to the next review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#71819d"/></marker></defs><style>
      .bg{fill:#0b1020}.panel{fill:#121a2d;stroke:#33415f;stroke-width:2}.muted{fill:#95a3bd}
      .title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.label{fill:#e8edf7;font:500 19px system-ui,sans-serif}
      .small{fill:#aebbd0;font:500 16px system-ui,sans-serif}.accent{fill:#7dd3fc}.warm{fill:#fbbf24}
      .line-a{fill:none;stroke:#7dd3fc;stroke-width:7;stroke-linecap:round}.line-b{fill:none;stroke:#fbbf24;stroke-width:7;stroke-linecap:round}
      .arrow{fill:none;stroke:#71819d;stroke-width:3;marker-end:url(#arrow)}
    </style><rect class="bg" width="1000" height="560" rx="28"/><text x="60" y="66" class="title">The Capability-Linked Contract Review Loop</text><rect x="71" y="185" width="128" height="150" rx="16" class="panel"/><text x="89" y="218" class="small">01</text><text x="89" y="255" class="label"><tspan x="89" dy="0">Proposed</tspan><tspan x="89" dy="23">operating</tspan><tspan x="89" dy="23">model</tspan></text><line x1="203" y1="260" x2="213" y2="260" class="arrow"/><rect x="217" y="185" width="128" height="150" rx="16" class="panel"/><text x="235" y="218" class="small">02</text><text x="235" y="255" class="label"><tspan x="235" dy="0">Model</tspan><tspan x="235" dy="23">release</tspan></text><line x1="349" y1="260" x2="359" y2="260" class="arrow"/><rect x="363" y="185" width="128" height="150" rx="16" class="panel"/><text x="381" y="218" class="small">03</text><text x="381" y="255" class="label"><tspan x="381" dy="0">Contract</tspan><tspan x="381" dy="23">evaluation</tspan></text><line x1="495" y1="260" x2="505" y2="260" class="arrow"/><rect x="509" y="185" width="128" height="150" rx="16" class="panel"/><text x="527" y="218" class="small">04</text><text x="527" y="255" class="label"><tspan x="527" dy="0">Default</tspan><tspan x="527" dy="23">review</tspan></text><line x1="641" y1="260" x2="651" y2="260" class="arrow"/><rect x="655" y="185" width="128" height="150" rx="16" class="panel"/><text x="673" y="218" class="small">05</text><text x="673" y="255" class="label"><tspan x="673" dy="0">Canary</tspan><tspan x="673" dy="23">against</tspan><tspan x="673" dy="23">control</tspan></text><line x1="787" y1="260" x2="797" y2="260" class="arrow"/><rect x="801" y="185" width="128" height="150" rx="16" class="panel"/><text x="819" y="218" class="small">06</text><text x="819" y="255" class="label"><tspan x="819" dy="0">Telemetry by</tspan><tspan x="819" dy="23">contract</tspan><tspan x="819" dy="23">version</tspan></text><path d="M865 350 C865 455,135 455,135 350" class="arrow"/><text x="420" y="445" class="small">telemetry starts the next review</text></svg>
