<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1045" role="img" aria-labelledby="title desc"><title id="title">Deliberate Research Continuation</title><desc id="desc">A completed report remains in place. The user invokes continuation, then approves its direction and allowance before research resumes in the same records. The continued work freezes a new source and generates new HTML while earlier snapshots and reports remain retained.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#71819d"/></marker></defs><style>
      .bg{fill:#0b1020}.panel{fill:#121a2d;stroke:#33415f;stroke-width:2}.muted{fill:#95a3bd}
      .title{fill:#f8fafc;font:700 30px system-ui,sans-serif}.label{fill:#e8edf7;font:500 19px system-ui,sans-serif}
      .small{fill:#aebbd0;font:500 16px system-ui,sans-serif}.accent{fill:#7dd3fc}.warm{fill:#fbbf24}
      .line-a{fill:none;stroke:#7dd3fc;stroke-width:7;stroke-linecap:round}.line-b{fill:none;stroke:#fbbf24;stroke-width:7;stroke-linecap:round}
      .arrow{fill:none;stroke:#71819d;stroke-width:3;marker-end:url(#arrow)}
    .label{font-size:25px}.title{font-size:27px}</style><rect class="bg" width="760" height="1045" rx="28"/><text x="40" y="60" class="title">Deliberate Research Continuation</text><rect x="75" y="110" width="580" height="100" rx="16" class="panel"/><text x="100" y="146" class="label"><tspan x="100" dy="0">Completed report remains</tspan></text><path d="M365 210 V230" class="arrow"/><rect x="75" y="235" width="580" height="100" rx="16" class="panel"/><text x="100" y="271" class="label"><tspan x="100" dy="0">User invokes continuation</tspan></text><path d="M365 335 V355" class="arrow"/><rect x="75" y="360" width="580" height="100" rx="16" class="panel"/><text x="100" y="396" class="label"><tspan x="100" dy="0">Approve direction and allowance</tspan></text><path d="M365 460 V480" class="arrow"/><rect x="75" y="485" width="580" height="100" rx="16" class="panel"/><text x="100" y="521" class="label"><tspan x="100" dy="0">Research resumes in same records</tspan></text><path d="M365 585 V605" class="arrow"/><rect x="75" y="610" width="580" height="100" rx="16" class="panel"/><text x="100" y="646" class="label"><tspan x="100" dy="0">Freeze new publication source</tspan></text><path d="M365 710 V730" class="arrow"/><rect x="75" y="735" width="580" height="100" rx="16" class="panel"/><text x="100" y="771" class="label"><tspan x="100" dy="0">Generate new HTML report</tspan></text><path d="M365 835 V855" class="arrow"/><rect x="75" y="860" width="580" height="100" rx="16" class="panel"/><text x="100" y="896" class="label"><tspan x="100" dy="0">Retain earlier snapshots and reports</tspan></text><path d="M655 910 H710 V85 H365 V105" class="arrow"/></svg>
